<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin – Grundschule Flegessen</title>
<meta name="description" content="Interner Admin-Bereich zum Bearbeiten der Texte und Bilder der Website der Grundschule Flegessen.">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="vendor/quill.snow.css?v=20260930-090657-680756">
<link rel="stylesheet" href="admin.css?v=20260930-090657-680756">
<script src="../js/version-check.js?v=20260930-090657-680756" defer></script>
</head>
<body>
<a class="skip-link" href="#main">Zum Inhalt springen</a>
<noscript><p style="padding:1rem">Für den Admin-Bereich wird JavaScript benötigt.</p></noscript>

<!-- ================= Anmeldung ================= -->
<div id="login" class="login" hidden>
  <div class="login-card">
    <div class="login-logo" aria-hidden="true">GS</div>
    <h1>Admin-Bereich</h1>
    <p class="lead">Grundschule Flegessen – Texte und Bilder der Website bearbeiten</p>
    <form id="loginForm" novalidate>
      <label class="mini-label" for="loginPw">Passwort</label>
      <div class="pw-row">
        <input id="loginPw" class="input" type="password" autocomplete="current-password" required>
        <button type="button" id="pwToggle" class="btn btn-outline btn-small" aria-pressed="false">Anzeigen</button>
      </div>
      <div id="loginError" class="form-msg err" role="alert" aria-live="assertive"></div>
      <button id="loginBtn" class="btn btn-primary btn-block" type="submit">Anmelden</button>
    </form>
    <p class="field-hint">Nach 5 Fehlversuchen ist die Anmeldung 10 Minuten gesperrt.</p>
  </div>
</div>

<!-- ================= App ================= -->
<div id="app" hidden>
  <header class="topbar">
    <button id="menuToggle" class="icon-btn" type="button" aria-label="Menü öffnen" aria-expanded="false" aria-controls="sidebar">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
    </button>
    <span class="topbar-title">Flegessen Admin</span>
    <span id="topDirty" class="dirty-dot" hidden title="Ungespeicherte Änderungen"><span class="visually-hidden">Ungespeicherte Änderungen</span></span>
  </header>

  <aside id="sidebar" class="sidebar" aria-label="Navigation">
    <div class="brand"><span class="brand-mark" aria-hidden="true">GS</span><span><strong>Grundschule Flegessen</strong><small>Admin-Bereich</small></span></div>
    <nav id="menu" aria-label="Hauptmenü"></nav>
  </aside>
  <div id="scrim" class="scrim"></div>

  <main id="main" class="main" tabindex="-1"></main>

  <div id="savebar" class="savebar" hidden>
    <span id="saveStatus" class="save-status" role="status" aria-live="polite">Alles gespeichert</span>
    <span class="spacer"></span>
    <button id="discardBtn" class="btn btn-outline" type="button" disabled>Verwerfen</button>
    <button id="saveBtn" class="btn btn-accent" type="button" disabled>Speichern</button>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="vendor/quill.js?v=20260930-090657-680756"></script>
<script src="js/core.js?v=20260930-090657-680756"></script>
<script src="js/editor.js?v=20260930-090657-680756"></script>
<script src="js/media.js?v=20260930-090657-680756"></script>
<script src="js/views.js?v=20260930-090657-680756"></script>
<script src="app.js?v=20260930-090657-680756"></script>
</body>
</html>
